<!-- Filter Buttons -->
<div class="filter-buttons">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="ac">AC Services</button>
  <button class="filter-btn" data-filter="fridge">Refrigerator</button>
  <button class="filter-btn" data-filter="washing">Washing Machine</button>
</div>

<!-- Gallery / Items Container -->
<div class="gallery-container">
  <!-- AC Items -->
  <div class="gallery-item ac">
    <img src="images/ac1.jpg" alt="AC Repair">
    <h3>AC Repair & Service</h3>
  </div>

  <!-- Fridge Items -->
  <div class="gallery-item fridge">
    <img src="images/fridge1.jpg" alt="Fridge Repair">
    <h3>Refrigerator Repair</h3>
  </div>

  <!-- Washing Machine Items -->
  <div class="gallery-item washing">
    <img src="images/washing1.jpg" alt="Washing Machine Repair">
    <h3>Washing Machine Repair</h3>
  </div>
</div>

<!-- JavaScript for Filtering -->
<script>
document.addEventListener('DOMContentLoaded', () => {
  const filterBtns = document.querySelectorAll('.filter-btn');
  const galleryItems = document.querySelectorAll('.gallery-item');

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      filterBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const filterValue = btn.getAttribute('data-filter');

      galleryItems.forEach(item => {
        if (filterValue === 'all' || item.classList.contains(filterValue)) {
          item.style.display = 'block';
        } else {
          item.style.display = 'none';
        }
      });
    });
  });
});
</script>
